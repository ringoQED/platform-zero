<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mong Kok Station - First Person FPS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="blocker">
        <div id="splash-container">
            <img id="splash-image" src="image/Splash_screen.jpg" alt="Platform Zero Splash Screen" draggable="false">
            <button id="enter-button" aria-label="Enter to Fight!"></button>
        </div>
    </div>
    
    <div id="crosshair"></div>
    <div id="ui-container">Mong Kok MTR • Sci-Fi Laser Rifle</div>
    <div id="ammo-display">LASER | ∞</div>
    <div id="health-display">HP: 100</div>
    <div id="enemy-ui-container">
        <div id="enemy-name">TARGET: ROGUE CRYSTAL</div>
        <div id="enemy-health-bar">
            <div id="enemy-health-fill"></div>
        </div>
        <div id="enemy-health-text">HP: 100 / 100</div>
    </div>
    <div id="game-over">
        <h1>Game Over!</h1>
        <button onclick="location.reload()">OK</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="enemy.js"></script>
    <script>
        let scene, camera, renderer, controls;
        window.playerHealth = 100;
        window.isDead = false;
        window.gameStarted = false;

        window.updateEnemyHealthUI = function(hp, maxHp) {
            const fill = document.getElementById('enemy-health-fill');
            const text = document.getElementById('enemy-health-text');
            const container = document.getElementById('enemy-ui-container');
            if (!fill || !text || !container) return;

            const pct = Math.max(0, Math.min(100, (hp / maxHp) * 100));
            fill.style.width = pct + '%';
            text.textContent = 'HP: ' + Math.max(0, hp) + ' / ' + maxHp;

            if (hp <= 0) {
                text.textContent = 'DESTROYED';
                fill.style.width = '0%';
                setTimeout(() => {
                    container.style.opacity = '0';
                    container.style.transform = 'translateX(-50%) translateY(-10px)';
                }, 800);
            } else {
                container.style.opacity = '1';
                container.style.transform = 'translateX(-50%) translateY(0)';
            }
        };

        window.damagePlayer = function(amount) {
            if (window.isDead) return;
            window.playerHealth -= amount;
            if (window.playerHealth <= 0) {
                window.playerHealth = 0;
                window.isDead = true;
                controls.unlock();
                document.getElementById('game-over').style.display = 'block';
                document.getElementById('blocker').style.display = 'none';
            }
            document.getElementById('health-display').textContent = 'HP: ' + window.playerHealth;
        };
        
        // Player Motion state
        let moveForward = false;
        let moveBackward = false;
        let moveLeft = false;
        let moveRight = false;
        let canJump = false;
        let isRunning = false;

        const velocity = new THREE.Vector3();
        let prevTime = performance.now();

        // Gameplay Physics Constants
        const WALK_SPEED = 7.5;
        const RUN_SPEED = 14.5;
        const GRAVITY = 28.0;
        const JUMP_VELOCITY = Math.sqrt(2 * GRAVITY * 0.8); // 0.8m height jump
        const PLAYER_HEIGHT = 1.6;
        const PLAYER_RADIUS = 0.45;

        // Scene Objects & Colliders
        const colliders = [];
        const interactableMeshes = [];
        window.interactableMeshes = interactableMeshes;
        window.colliders = colliders;

        // Weapon System & Animation Parameters
        let weaponGroup;
        let muzzleLight;
        let muzzleFlashTimer = 0;
        let bobTimer = 0;
        let rifleModel = null;
        let muzzleMarker = null;
        let playerLaserBeam = null;
        let playerLaserCore = null;
        let playerLaserTimer = 0;
        let gunSoundBuffer = null;

        // Camera relative positioning for sci-fi rifle
        const weaponBasePosition = new THREE.Vector3(0.20, -0.22, -0.38);
        const recoilOffset = new THREE.Vector3(0, 0, 0);
        let recoilRotation = 0;

        // Dynamic FX Systems
        const particles = [];
        const bulletMarks = [];
        let audioCtx = null;

        function createTerrazzoTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#d6c0a7';
            ctx.fillRect(0, 0, 512, 512);

            const colors = ['#3a2618', '#1c120a', '#784c2d', '#ebd8c5', '#a6876c', '#8c2d1d', '#523421'];
            for (let i = 0; i < 12000; i++) {
                ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
                const x = Math.random() * 512;
                const y = Math.random() * 512;
                const size = Math.random() * 3 + 1;
                ctx.fillRect(x, y, size, size);
            }

            // Grid tile seams
            ctx.strokeStyle = 'rgba(110, 90, 70, 0.3)';
            ctx.lineWidth = 3;
            for(let p = 0; p <= 512; p += 128) {
                ctx.beginPath(); ctx.moveTo(p, 0); ctx.lineTo(p, 512); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, p); ctx.lineTo(512, p); ctx.stroke();
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(25, 25); 
            tex.magFilter = THREE.LinearFilter; 
            return tex;
        }

        function createSlattedCeilingTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#111115';
            ctx.fillRect(0, 0, 128, 128);

            // Dark louvers / slats
            for (let y = 0; y < 128; y += 8) {
                ctx.fillStyle = '#3a3a42';
                ctx.fillRect(0, y, 128, 5);
                ctx.fillStyle = '#08080a';
                ctx.fillRect(0, y + 5, 128, 3);
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(30, 30);
            return tex;
        }

        function createMosaicPillarTexture(width, height, hasText) {
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            
            // Vibrant red base
            ctx.fillStyle = '#cc1111';
            ctx.fillRect(0, 0, width, height);

            // Mosaic grid tiles
            const tileSize = 12;
            ctx.strokeStyle = '#990000';
            ctx.lineWidth = 1;
            
            ctx.beginPath();
            for(let x = 0; x <= width; x += tileSize) {
                ctx.moveTo(x, 0); ctx.lineTo(x, height);
            }
            for(let y = 0; y <= height; y += tileSize) {
                ctx.moveTo(0, y); ctx.lineTo(width, y);
            }
            ctx.stroke();

            // Random slight mosaic tile color variations
            for (let x = 0; x < width; x += tileSize) {
                for (let y = 0; y < height; y += tileSize) {
                    if (Math.random() > 0.55) {
                        ctx.fillStyle = Math.random() > 0.5 ? '#e62222' : '#b30909';
                        ctx.fillRect(x + 1, y + 1, tileSize - 2, tileSize - 2);
                    }
                }
            }

            // Dark base trim at bottom
            ctx.fillStyle = '#111115';
            ctx.fillRect(0, height - (height * 0.08), width, height * 0.08);

            // Station Signage Text (Chinese + English)
            if (hasText) {
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                // Drop shadow
                ctx.fillStyle = '#000000';
                const off = 3;
                ctx.font = 'bold 54px "Noto Sans CJK TC", "Microsoft JhengHei", sans-serif';
                ctx.fillText('旺角', width / 2 + off, height * 0.25 + off);
                ctx.font = 'bold 32px Arial, sans-serif';
                ctx.fillText('Mong Kok', width / 2 + off, height * 0.36 + off);

                // Pure White Text
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 54px "Noto Sans CJK TC", "Microsoft JhengHei", sans-serif';
                ctx.fillText('旺角', width / 2, height * 0.25);
                ctx.font = 'bold 32px Arial, sans-serif';
                ctx.fillText('Mong Kok', width / 2, height * 0.36);
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.minFilter = THREE.LinearMipmapLinearFilter;
            return tex;
        }

        function createScreenDoorTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#1c2026';
            ctx.fillRect(0, 0, 256, 256);

            // Glass door panels
            ctx.fillStyle = '#2d3748';
            ctx.fillRect(10, 16, 110, 224);
            ctx.fillRect(136, 16, 110, 224);

            // Metallic frames
            ctx.strokeStyle = '#64748b';
            ctx.lineWidth = 4;
            ctx.strokeRect(10, 16, 110, 224);
            ctx.strokeRect(136, 16, 110, 224);

            // Warning stripe
            ctx.fillStyle = '#ef4444';
            ctx.fillRect(10, 120, 236, 8);

            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(16, 1);
            return tex;
        }

        function initGunSound() {
            try {
                fetch('sound/gun_sound.mp3')
                    .then(res => res.arrayBuffer())
                    .then(arrayBuffer => {
                        const AudioCtx = window.AudioContext || window.webkitAudioContext;
                        if (!audioCtx) audioCtx = new AudioCtx();
                        return audioCtx.decodeAudioData(arrayBuffer);
                    })
                    .then(buffer => {
                        gunSoundBuffer = buffer;
                    })
                    .catch(e => console.warn('Could not preload gun_sound.mp3:', e));
            } catch(e) {
                console.warn(e);
            }
        }

        function playGunshotSound() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!audioCtx) audioCtx = new AudioCtx();
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                if (gunSoundBuffer) {
                    const source = audioCtx.createBufferSource();
                    source.buffer = gunSoundBuffer;
                    const gain = audioCtx.createGain();
                    gain.gain.value = 0.8;
                    source.connect(gain);
                    gain.connect(audioCtx.destination);
                    source.start(0);
                } else {
                    const audio = new Audio('sound/gun_sound.mp3');
                    audio.volume = 0.8;
                    audio.play().catch(() => {});
                }
            } catch(e) {
                console.warn('Audio error:', e);
            }
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color('#08080c');
            scene.fog = new THREE.FogExp2('#0a0a0f', 0.018);
            
            initEnemy(scene);

            camera = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.05, 120);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.outputEncoding = THREE.sRGBEncoding;
            document.body.appendChild(renderer.domElement);

            // FPS Controls
            controls = new THREE.PointerLockControls(camera, document.body);

            const blocker = document.getElementById('blocker');
            const splashContainer = document.getElementById('splash-container');
            const enterButton = document.getElementById('enter-button');

            function startGame() {
                window.gameStarted = true;
                controls.lock();
            }

            if (enterButton) {
                enterButton.addEventListener('click', function (e) {
                    e.stopPropagation();
                    startGame();
                });
            }

            if (splashContainer) {
                splashContainer.addEventListener('click', startGame);
            }

            controls.addEventListener('lock', function () {
                if (splashContainer) splashContainer.style.opacity = '0';
                setTimeout(() => { blocker.style.display = 'none'; }, 200);
            });

            controls.addEventListener('unlock', function () {
                if (window.isDead) return;
                blocker.style.display = 'flex';
                if (splashContainer) splashContainer.style.opacity = '0.7';
            });

            scene.add(controls.getObject());
            controls.getObject().position.set(0, PLAYER_HEIGHT, 10);

            createLevel();
            initGunSound();
            loadRifleModel();
            setupLighting();
            setupInput();

            window.addEventListener('resize', onWindowResize);
            
            animate();
        }

        function createLevel() {
            const floorTex = createTerrazzoTexture();
            const ceilingTex = createSlattedCeilingTexture();
            const doorTex = createScreenDoorTexture();

            const floorMat = new THREE.MeshLambertMaterial({ map: floorTex, roughness: 0.45 });
            const ceilingMat = new THREE.MeshLambertMaterial({ map: ceilingTex });

            // Main Station Floor (100x100m)
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);
            interactableMeshes.push(floor);

            // Ceiling with slatted texture
            const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), ceilingMat);
            ceiling.rotation.x = Math.PI / 2;
            ceiling.position.y = 4.2;
            scene.add(ceiling);
            interactableMeshes.push(ceiling);

            // Mosaic Pillars
            const frontTex = createMosaicPillarTexture(256, 512, true);
            const sideTex = createMosaicPillarTexture(64, 64, false);
            sideTex.wrapS = THREE.RepeatWrapping;
            sideTex.wrapT = THREE.RepeatWrapping;
            sideTex.repeat.set(1, 6); 

            const matFront = new THREE.MeshLambertMaterial({ map: frontTex });
            const matSide = new THREE.MeshLambertMaterial({ map: sideTex });
            const matDark = new THREE.MeshLambertMaterial({ color: 0x111115 });

            const pillarMaterials = [matSide, matSide, matDark, matDark, matFront, matFront];
            const pillarGeo = new THREE.BoxGeometry(2.6, 4.2, 1.2);

            for (let x = -40; x <= 40; x += 16) {
                for (let z = -40; z <= 40; z += 16) {
                    const pillar = new THREE.Mesh(pillarGeo, pillarMaterials);
                    pillar.position.set(x, 2.1, z);
                    scene.add(pillar);
                    interactableMeshes.push(pillar);

                    const boundingBox = new THREE.Box3().setFromObject(pillar);
                    colliders.push(boundingBox);
                }
            }

            // Platform Screen Doors & Outer Boundary Walls
            const wallMat = new THREE.MeshLambertMaterial({ map: doorTex });
            const backWallMat = new THREE.MeshLambertMaterial({ color: 0x1e2228 });

            // Left Platform Wall
            const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(100, 4.2), wallMat);
            leftWall.position.set(-49.5, 2.1, 0);
            leftWall.rotation.y = Math.PI / 2;
            scene.add(leftWall);
            interactableMeshes.push(leftWall);
            colliders.push(new THREE.Box3().setFromObject(leftWall));

            // Right Platform Wall
            const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(100, 4.2), wallMat);
            rightWall.position.set(49.5, 2.1, 0);
            rightWall.rotation.y = -Math.PI / 2;
            scene.add(rightWall);
            interactableMeshes.push(rightWall);
            colliders.push(new THREE.Box3().setFromObject(rightWall));

            // Front Outer Wall
            const frontWall = new THREE.Mesh(new THREE.PlaneGeometry(100, 4.2), backWallMat);
            frontWall.position.set(0, 2.1, -49.5);
            scene.add(frontWall);
            interactableMeshes.push(frontWall);
            colliders.push(new THREE.Box3().setFromObject(frontWall));

            // Back Outer Wall
            const backWall = new THREE.Mesh(new THREE.PlaneGeometry(100, 4.2), backWallMat);
            backWall.position.set(0, 2.1, 49.5);
            backWall.rotation.y = Math.PI;
            scene.add(backWall);
            interactableMeshes.push(backWall);
            colliders.push(new THREE.Box3().setFromObject(backWall));
        }

        function loadRifleModel() {
            weaponGroup = new THREE.Group();

            // Player Blue Laser Beam (20mm diameter: radius = 0.01m)
            const laserGeo = new THREE.CylinderGeometry(0.01, 0.01, 1, 8);
            laserGeo.rotateX(Math.PI / 2);
            laserGeo.translate(0, 0, 0.5); // origin at start of cylinder
            const laserMat = new THREE.MeshBasicMaterial({ 
                color: 0x00aaff, 
                transparent: true, 
                opacity: 0.92 
            });
            playerLaserBeam = new THREE.Mesh(laserGeo, laserMat);

            // Bright core inside beam for intense sci-fi laser glow
            const coreGeo = new THREE.CylinderGeometry(0.005, 0.005, 1, 6);
            coreGeo.rotateX(Math.PI / 2);
            coreGeo.translate(0, 0, 0.5);
            const coreMat = new THREE.MeshBasicMaterial({ color: 0xebf8ff });
            playerLaserCore = new THREE.Mesh(coreGeo, coreMat);
            playerLaserBeam.add(playerLaserCore);

            playerLaserBeam.visible = false;
            scene.add(playerLaserBeam);

            // Blue Muzzle Point Light
            muzzleLight = new THREE.PointLight(0x00bfff, 0, 10);
            weaponGroup.add(muzzleLight);

            // Muzzle Marker where laser beam originates
            muzzleMarker = new THREE.Object3D();
            weaponGroup.add(muzzleMarker);

            // Position and angle for first-person perspective
            weaponBasePosition.set(0.20, -0.22, -0.38);
            weaponGroup.position.copy(weaponBasePosition);
            weaponGroup.rotation.set(0.03, -0.04, 0.02);

            camera.add(weaponGroup);

            // Load rifle.glb
            const loader = new THREE.GLTFLoader();
            loader.load('model/rifle.glb', (gltf) => {
                rifleModel = gltf.scene;

                // Model length is ~4.1m along Z unscaled. Scale by 0.22 gives ~0.90m length
                const scale = 0.22;
                rifleModel.scale.set(scale, scale, scale);

                // Position model inside weaponGroup
                rifleModel.position.set(0, -0.08, 0.12);

                // Barrel tip location: unscaled is at (0.037, 0.534, -2.508)
                muzzleMarker.position.set(
                    rifleModel.position.x + 0.037 * scale,
                    rifleModel.position.y + 0.534 * scale,
                    rifleModel.position.z - 2.508 * scale
                );
                muzzleLight.position.copy(muzzleMarker.position);

                weaponGroup.add(rifleModel);
            }, undefined, (error) => {
                console.error('Error loading rifle.glb:', error);
            });
        }

        function setupLighting() {
            scene.add(new THREE.AmbientLight(0xfff2e6, 0.68));

            // Central Recessed Light Strip Trough
            const tubeGeo = new THREE.BoxGeometry(100, 0.08, 0.35);
            const tubeMat = new THREE.MeshBasicMaterial({ color: 0xfffcf5 });

            for (let x = -40; x <= 40; x += 16) { 
                const lightStrip = new THREE.Mesh(tubeGeo, tubeMat);
                lightStrip.position.set(x, 4.12, 0);
                lightStrip.rotation.y = Math.PI / 2;
                scene.add(lightStrip);
            }

            // Warm station lighting
            for (let x = -32; x <= 32; x += 32) {
                for (let z = -32; z <= 32; z += 32) {
                    const pl = new THREE.PointLight(0xffecd8, 0.4, 38);
                    pl.position.set(x, 3.8, z);
                    scene.add(pl);
                }
            }
        }

        function setupInput() {
            const onKeyDown = function (event) {
                switch (event.code) {
                    case 'ArrowUp':
                    case 'KeyW': moveForward = true; break;
                    case 'ArrowLeft':
                    case 'KeyA': moveLeft = true; break;
                    case 'ArrowDown':
                    case 'KeyS': moveBackward = true; break;
                    case 'ArrowRight':
                    case 'KeyD': moveRight = true; break;
                    case 'ShiftLeft':
                    case 'ShiftRight': isRunning = true; break;
                    case 'Space':
                        if (canJump) {
                            velocity.y += JUMP_VELOCITY;
                            canJump = false;
                        }
                        break;
                }
            };

            const onKeyUp = function (event) {
                switch (event.code) {
                    case 'ArrowUp':
                    case 'KeyW': moveForward = false; break;
                    case 'ArrowLeft':
                    case 'KeyA': moveLeft = false; break;
                    case 'ArrowDown':
                    case 'KeyS': moveBackward = false; break;
                    case 'ArrowRight':
                    case 'KeyD': moveRight = false; break;
                    case 'ShiftLeft':
                    case 'ShiftRight': isRunning = false; break;
                }
            };

            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);

            // Left Mouse Click triggers rifle laser firing
            document.addEventListener('mousedown', function (event) {
                if (controls.isLocked && event.button === 0) {
                    shootRifle();
                }
            });
        }

        function shootRifle() {
            playGunshotSound();

            // Trigger Sci-Fi Rifle Recoil
            recoilRotation += 0.12;
            recoilOffset.z += 0.055;
            recoilOffset.y += 0.008;

            // Trigger Blue Muzzle Flash Light
            if (muzzleLight) {
                muzzleLight.intensity = 5.5;
                muzzleFlashTimer = 0.06;
            }

            // Raycast for laser impact from crosshair (camera center)
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

            // Targets include all scene obstacles and enemy (if alive)
            const targets = [...interactableMeshes];
            if (window.enemyManager && window.enemyManager.crystal && !window.enemyManager.isDead) {
                targets.push(window.enemyManager.crystal);
            }

            const intersects = raycaster.intersectObjects(targets, true);

            let targetPoint;
            let hitNormal = null;

            if (intersects.length > 0) {
                const hit = intersects[0];
                targetPoint = hit.point;
                if (hit.face) hitNormal = hit.face.normal;

                // Check if hit enemy crystal
                if (window.enemyManager && window.enemyManager.isEnemyObject(hit.object)) {
                    window.enemyManager.takeDamage(50, hit.point);
                    spawnLaserImpactSparks(hit.point, hitNormal || new THREE.Vector3(0, 1, 0));
                } else {
                    spawnLaserImpactSparks(hit.point, hitNormal || new THREE.Vector3(0, 1, 0));
                    if (hitNormal) {
                        spawnLaserDecal(hit.point, hitNormal);
                    }
                }
            } else {
                // If aiming into open distance, extend 100 meters forward
                targetPoint = raycaster.ray.origin.clone().add(raycaster.ray.direction.clone().multiplyScalar(100));
            }

            // Muzzle world position
            const muzzleWorldPos = new THREE.Vector3();
            if (muzzleMarker) {
                muzzleMarker.getWorldPosition(muzzleWorldPos);
            } else {
                weaponGroup.getWorldPosition(muzzleWorldPos);
            }

            // Emit 20mm diameter blue laser beam from rifle muzzle to target
            if (playerLaserBeam) {
                const laserDist = muzzleWorldPos.distanceTo(targetPoint);
                playerLaserBeam.position.copy(muzzleWorldPos);
                playerLaserBeam.lookAt(targetPoint);
                playerLaserBeam.scale.set(1, 1, laserDist);
                playerLaserBeam.visible = true;
                playerLaserTimer = 0.08; // 80ms laser beam pulse
            }
        }

        function spawnLaserImpactSparks(position, normal) {
            for (let i = 0; i < 10; i++) {
                const sparkGeo = new THREE.BoxGeometry(0.015, 0.015, 0.015);
                const sparkMat = new THREE.MeshBasicMaterial({ color: 0x00d0ff });
                const spark = new THREE.Mesh(sparkGeo, sparkMat);
                spark.position.copy(position);

                const reflect = normal.clone().add(new THREE.Vector3(
                    (Math.random() - 0.5) * 1.4,
                    (Math.random() - 0.5) * 1.4,
                    (Math.random() - 0.5) * 1.4
                )).normalize().multiplyScalar(4.0 + Math.random() * 3.5);

                particles.push({
                    mesh: spark,
                    velocity: reflect,
                    life: 0.18 + Math.random() * 0.12,
                    maxLife: 0.3,
                    type: 'spark'
                });
                scene.add(spark);
            }
        }

        function spawnLaserDecal(position, normal) {
            const decalGeo = new THREE.PlaneGeometry(0.08, 0.08);
            const decalMat = new THREE.MeshBasicMaterial({
                color: 0x0088ff,
                transparent: true,
                opacity: 0.85,
                side: THREE.DoubleSide,
                polygonOffset: true,
                polygonOffsetFactor: -1
            });
            const decal = new THREE.Mesh(decalGeo, decalMat);
            decal.position.copy(position).add(normal.clone().multiplyScalar(0.005));
            decal.lookAt(position.clone().add(normal));

            scene.add(decal);
            bulletMarks.push(decal);

            if (bulletMarks.length > 40) {
                const old = bulletMarks.shift();
                scene.remove(old);
            }
        }

        function checkCollisions(proposedPosition) {
            const playerBox = new THREE.Box3().setFromCenterAndSize(
                new THREE.Vector3(proposedPosition.x, proposedPosition.y - (PLAYER_HEIGHT / 2), proposedPosition.z),
                new THREE.Vector3(PLAYER_RADIUS * 2, PLAYER_HEIGHT, PLAYER_RADIUS * 2)
            );

            for (let i = 0; i < colliders.length; i++) {
                if (playerBox.intersectsBox(colliders[i])) {
                    return true;
                }
            }
            return false;
        }

        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            const delta = Math.min((time - prevTime) / 1000, 0.1);
            
            updateEnemy(delta, camera);

            if (window.isDead) {
                // Death camera animation
                camera.rotation.z = THREE.MathUtils.lerp(camera.rotation.z, Math.PI / 2, delta * 3);
                camera.position.y = THREE.MathUtils.lerp(camera.position.y, 0.2, delta * 5);
            } else if (controls.isLocked) {

                // Handle Muzzle Flash Timer
                if (muzzleFlashTimer > 0) {
                    muzzleFlashTimer -= delta;
                    if (muzzleFlashTimer <= 0) {
                        muzzleFlashGroup.visible = false;
                        muzzleLight.intensity = 0;
                    }
                }

                // Calculate WASD direction vectors relative to current camera heading
                const forward = new THREE.Vector3();
                camera.getWorldDirection(forward);
                forward.y = 0;
                forward.normalize();

                const right = new THREE.Vector3();
                right.crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();

                const moveDir = new THREE.Vector3(0, 0, 0);

                if (moveForward) moveDir.add(forward);
                if (moveBackward) moveDir.sub(forward);
                if (moveRight) moveDir.add(right);
                if (moveLeft) moveDir.sub(right);

                if (moveDir.lengthSq() > 0) {
                    moveDir.normalize();
                }

                const targetSpeed = (moveForward || moveBackward || moveLeft || moveRight) ? (isRunning ? RUN_SPEED : WALK_SPEED) : 0;

                const accel = 14.0;
                velocity.x += (moveDir.x * targetSpeed - velocity.x) * Math.min(delta * accel, 1.0);
                velocity.z += (moveDir.z * targetSpeed - velocity.z) * Math.min(delta * accel, 1.0);

                velocity.y -= GRAVITY * delta;

                const camPos = controls.getObject().position;

                // Collision detection sliding
                camPos.x += velocity.x * delta;
                if (checkCollisions(camPos)) {
                    camPos.x -= velocity.x * delta;
                    velocity.x = 0;
                }

                camPos.z += velocity.z * delta;
                if (checkCollisions(camPos)) {
                    camPos.z -= velocity.z * delta;
                    velocity.z = 0;
                }

                // Y-Axis Jump / Gravity physics
                camPos.y += velocity.y * delta;
                if (camPos.y < PLAYER_HEIGHT) {
                    velocity.y = 0;
                    camPos.y = PLAYER_HEIGHT;
                    canJump = true;
                }

                // Weapon Sway & Walking Bobbing
                const speed = Math.sqrt(velocity.x * velocity.x + velocity.z * velocity.z);
                if (speed > 0.5 && canJump) {
                    const bobSpeed = isRunning ? 16 : 10;
                    const bobAmountScale = isRunning ? 1.3 : 1.0;
                    bobTimer += delta * bobSpeed;

                    weaponGroup.position.y = weaponBasePosition.y + Math.abs(Math.sin(bobTimer)) * 0.016 * bobAmountScale - recoilOffset.y;
                    weaponGroup.position.x = weaponBasePosition.x + Math.cos(bobTimer) * 0.012 * bobAmountScale;
                } else {
                    bobTimer = 0;
                    weaponGroup.position.x = THREE.MathUtils.lerp(weaponGroup.position.x, weaponBasePosition.x, delta * 8);
                    weaponGroup.position.y = THREE.MathUtils.lerp(weaponGroup.position.y, weaponBasePosition.y - recoilOffset.y, delta * 8);
                }

                // Smoothly recover from weapon recoil
                recoilRotation *= (1 - delta * 12);
                recoilOffset.z *= (1 - delta * 10);
                recoilOffset.y *= (1 - delta * 10);

                if (weaponGroup) {
                    weaponGroup.position.z = weaponBasePosition.z + recoilOffset.z;
                    weaponGroup.rotation.x = 0.03 + recoilRotation;
                }

                // Update player laser beam & muzzle flash timers
                if (playerLaserTimer > 0) {
                    playerLaserTimer -= delta;
                    if (playerLaserTimer <= 0 && playerLaserBeam) {
                        playerLaserBeam.visible = false;
                    }
                }
                if (muzzleFlashTimer > 0) {
                    muzzleFlashTimer -= delta;
                    if (muzzleFlashTimer <= 0 && muzzleLight) {
                        muzzleLight.intensity = 0;
                    }
                }

                // Update Active Particles
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.life -= delta;

                    if (p.life <= 0) {
                        scene.remove(p.mesh);
                        particles.splice(i, 1);
                        continue;
                    }

                    p.mesh.position.addScaledVector(p.velocity, delta);

                    if (p.type === 'smoke') {
                        const opacity = (p.life / p.maxLife) * 0.6;
                        p.mesh.material.opacity = opacity;
                        p.mesh.scale.addScalar(delta * 1.5);
                    } else if (p.type === 'spark') {
                        p.velocity.y -= GRAVITY * 0.5 * delta;
                    }
                }
            }

            prevTime = time;
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.onload = init;
    </script>
</body>
